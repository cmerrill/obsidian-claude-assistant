name: Obsidian Claude Assistant
slug: obsidian_claude_assistant
version: "0.7.0"
description: >-
  Syncs an Obsidian vault headlessly, then files anything dropped in inbox/ into
  the right note type and folder with Claude Code. Asks by push notification when
  it is unsure, and accepts your reply from the notification or from its web
  page, where you can also paste long text, upload files, and drop new captures.
  Keeps todo/ tidy by moving finished tasks into their note's Done section.
url: https://github.com/cmerrill/obsidian-claude-assistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:message-question-outline
panel_title: Claude Assistant
map:
  - type: share
    read_only: false
options:
  obsidian_email: ""
  obsidian_password: ""
  obsidian_vault_name: ""
  claude_oauth_token: ""
  git_repo_url: ""
  git_branch: main
  git_ssh_key: ""
  git_user_name: Obsidian Claude Assistant
  git_user_email: obsidian-claude-assistant@localhost
  vault_path: /share/notes
  interval_minutes: 10
  inbox_settle_minutes: 2
  model: sonnet
  permission_mode: allowlist
  notify_service: ""
  notify_on: questions
  enable_replies: true
  persistent_shortcut: false
  max_notifications_per_cycle: 3
  log_level: info
schema:
  obsidian_email: email
  obsidian_password: password
  obsidian_vault_name: str
  claude_oauth_token: password
  git_repo_url: str
  git_branch: str
  git_ssh_key: password
  git_user_name: str
  git_user_email: str
  vault_path: str
  interval_minutes: int(1,1440)
  inbox_settle_minutes: int(0,120)
  model: str
  permission_mode: list(allowlist|bypass)
  notify_service: str?
  notify_on: list(always|questions|errors)
  enable_replies: bool
  persistent_shortcut: bool
  max_notifications_per_cycle: int(1,10)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
